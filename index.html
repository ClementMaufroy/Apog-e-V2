<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apogée</title>
<meta name="theme-color" content="#01332f">
<meta name="description" content="Suivi de patrimoine personnel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icone-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icone-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icone-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Apogée">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
<style>
:root{
  --bg:#f4f3ef; --surface:#fff; --surface2:#f8f7f3; --border:#e6e3da; --border2:#d3cfc3;
  --text:#1a1916; --text2:#5f5c55; --text3:#94908a;
  --accent:#1a3c2e; --accent-hover:#24523f; --on-accent:#fff; --accent-soft:#e4eee8;
  --pos:#1d7a4c; --neg:#b3402f; --warn:#8a5c00; --warn-bg:#fcf1d8; --info-bg:#eef3f7;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(30,25,10,.05),0 6px 20px rgba(30,25,10,.04);
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',monospace;
  --cat-immobilier:#3b6ea5; --cat-liquidites:#4c9a78; --cat-placements:#8a63c2; --cat-salariale:#c7843b;
  --cat-crypto:#c9a227; --cat-obligations:#c4605a; --cat-autre:#8a877f;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121311; --surface:#1b1c19; --surface2:#22231f; --border:#2d2f2a; --border2:#3b3d37;
    --text:#ecebe5; --text2:#b4b1a8; --text3:#7f7c75;
    --accent:#86c8a2; --accent-hover:#a2d8b8; --on-accent:#0f2419; --accent-soft:#1d3127;
    --pos:#6fcf97; --neg:#f08b7b; --warn:#e8c56c; --warn-bg:#352c19; --info-bg:#1c2630;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--text3)} .text2{color:var(--text2)}

/* ── Connexion ── */
.logo-entete{height:32px;width:auto;display:block}
.logo-connexion{width:210px;max-width:80%;height:auto;display:block;margin:0 auto 6px}
.chargement-ecran{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.chargement-ecran[hidden]{display:none}
.chargement-icone{border-radius:18px;box-shadow:var(--shadow)}
.roue{width:30px;height:30px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--accent);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
#chargement-texte{color:var(--text2);font-size:14px}
.connexion{min-height:100vh;display:grid;place-items:center;padding:24px}
.connexion-carte{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:40px 36px;max-width:380px;width:100%;text-align:center}
.connexion-carte h1{font-size:26px;letter-spacing:-.5px;margin:14px 0 4px}
.connexion-carte p{color:var(--text2);margin-bottom:24px}
.erreur{color:var(--neg);font-size:13px;margin-top:14px}
.form-connexion{display:flex;flex-direction:column;gap:12px;text-align:left}
.lien-discret{background:none;border:0;color:var(--text2);font-size:13px;margin-top:14px;cursor:pointer;text-decoration:underline}
.connexion-carte p.erreur{color:var(--neg);margin:12px 0 0}
.connexion-carte p.info-cx{color:var(--pos);font-size:13px;margin:10px 0 0}

/* ── En-tête ── */
.entete{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.entete-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.marque{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.3px;text-decoration:none;flex-shrink:0}
.nav{display:flex;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--radius-sm);text-decoration:none;color:var(--text2);font-size:13.5px;white-space:nowrap}
.nav a svg{width:16px;height:16px;flex-shrink:0}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.actif{background:var(--accent);color:var(--on-accent)}
.entete-droite{display:flex;align-items:center;gap:10px;flex-shrink:0}
.filtre{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px}
.filtre button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--text2);cursor:pointer}
.filtre button.actif{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.statut{font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.statut::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.statut.ok{color:var(--pos)} .statut.attente{color:var(--warn)} .statut.erreur{color:var(--neg)} .statut.local{color:var(--warn)}
.btn-icone{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--text2);text-decoration:none;border:0;background:none;cursor:pointer}
.btn-icone:hover{background:var(--surface2);color:var(--text)}
.btn-icone.actif{background:var(--accent);color:var(--on-accent)}
.btn-icone svg{width:17px;height:17px}

/* ── Page ── */
.page{max-width:1120px;margin:0 auto;padding:26px 20px 60px}
.titre-page{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.titre-page h1{font-size:22px;letter-spacing:-.4px;font-weight:600}
.titre-page p{color:var(--text3);font-size:13px;margin-top:2px}
.carte{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.carte + .carte{margin-top:16px}
.carte h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grille{display:grid;gap:16px}
.g-2{grid-template-columns:1.35fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.pile > * + *{margin-top:16px}
.bandeau{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;background:var(--info-bg);color:var(--text2);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.bandeau.warn{background:var(--warn-bg);color:var(--warn)}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border2);background:var(--surface);border-radius:var(--radius-sm);padding:8px 14px;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-primaire{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn-primaire:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--border))}
.btn-danger:hover{background:color-mix(in srgb,var(--neg) 8%,var(--surface))}
.btn-lien{border:0;background:none;padding:4px 6px;color:var(--text2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px}
.btn-petit{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.segment{display:inline-flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.segment button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer;border-right:1px solid var(--border)}
.segment button:last-child{border-right:0}
.segment button.actif{background:var(--accent);color:var(--on-accent)}

/* ── Tableau de bord ── */
.hero-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.hero-valeur{font-size:44px;font-weight:500;letter-spacing:-1.5px;margin:4px 0 6px;line-height:1.1}
.hero-sous{color:var(--text2);font-size:13px}
.pastilles{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pastille{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--text2)}
.pastille strong{font-weight:600}
.graph{position:relative;height:220px}
.graph-grand{position:relative;height:340px}
.hero{display:flex;flex-direction:column}
.graph-hero{flex:1;min-height:220px;margin-top:18px}
.repartition{display:flex;flex-direction:column;gap:11px}
.rep-ligne{display:grid;grid-template-columns:minmax(0,1fr) auto 58px;gap:2px 10px;font-size:13px;align-items:baseline}
.rep-ligne .num{text-align:right;white-space:nowrap}
.rep-ligne .rep-pct{text-align:right;color:var(--text3);font-family:var(--mono);font-size:12px;white-space:nowrap}
.rep-barre{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.rep-barre span{display:block;height:100%;border-radius:4px}
.objectif-barre{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;margin:10px 0 6px}
.objectif-barre span{display:block;height:100%;background:var(--accent);border-radius:5px}
.maj-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ── Listes de comptes ── */
.section-titre{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin:22px 0 8px;display:flex;justify-content:space-between;gap:10px}
.section-titre:first-child{margin-top:0}
table.tab{width:100%;border-collapse:collapse;font-size:13.5px}
table.tab-comptes{table-layout:fixed;min-width:640px}
@media (max-width:640px){table.tab-comptes{table-layout:auto;min-width:0}}
.tab th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:500;text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--border)}
.tab td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tab tr:last-child td{border-bottom:0}
.tab .d{text-align:right}
.tab tfoot td{font-weight:600;border-top:1px solid var(--border2);border-bottom:0}
.tab tr.cliquable{cursor:pointer}
.tab tr.cliquable:hover td{background:var(--surface2)}
.tab tr.selection td{background:var(--accent-soft)}
.tab tr.estompe td{opacity:.45}
.nom-compte{font-weight:500}
.sous{font-size:12px;color:var(--text3)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.badge.couple{background:color-mix(in srgb,var(--cat-placements) 12%,var(--surface));border-color:color-mix(in srgb,var(--cat-placements) 25%,var(--border))}
.badge.clement{background:color-mix(in srgb,var(--cat-immobilier) 12%,var(--surface));border-color:color-mix(in srgb,var(--cat-immobilier) 25%,var(--border))}
.badge.alexandre{background:color-mix(in srgb,var(--cat-liquidites) 12%,var(--surface));border-color:color-mix(in srgb,var(--cat-liquidites) 25%,var(--border))}
.tab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── Mise à jour ── */
.maj-ligne{display:grid;grid-template-columns:minmax(0,1fr) 130px 150px 110px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)}
.maj-ligne:last-child{border-bottom:0}
.maj-entete{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding-top:0}
.champ-montant{display:flex;align-items:center;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);padding:0 10px}
.champ-montant:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.champ-montant input{border:0;background:none;outline:0;width:100%;padding:8px 0;text-align:right;font-family:var(--mono);font-size:14px}
.champ-montant span{color:var(--text3);margin-left:6px}
.champ-montant.invalide{border-color:var(--neg)}
.maj-pied{position:sticky;bottom:0;z-index:5;margin-top:16px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 -4px 20px rgba(0,0,0,.06);padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.maj-pied .total{flex:1;min-width:200px}
.maj-pied .total strong{font-size:22px;font-weight:500;letter-spacing:-.5px}
.maj-boutons{display:flex;gap:8px}

/* ── Formulaires & dialogues ── */
dialog{margin:auto;border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(15,15,10,.45)}
.dlg-tete{padding:18px 22px 4px;font-size:17px;font-weight:600}
.dlg-corps{padding:12px 22px;max-height:calc(100vh - 170px);overflow:auto}
.dlg-pied{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--border)}
.dlg-pied .gauche{margin-right:auto;display:flex;gap:8px}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.champ{display:flex;flex-direction:column;gap:5px}
.champ.large{grid-column:1/-1}
.champ label{font-size:12px;color:var(--text2);font-weight:500}
.champ input,.champ select{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface);outline:0;width:100%}
.champ input:focus,.champ select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.champ .aide{font-size:11.5px;color:var(--text3)}
.sep{height:1px;background:var(--border);margin:16px 0}
.sous-titre{font-size:13px;font-weight:600;margin-bottom:8px}
.credit-ligne{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface2)}
.credit-ligne .infos{flex:1;min-width:0}
.boite{border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:12px;margin-top:8px}
.radios{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px;font-size:13px}
.radios label{display:flex;align-items:center;gap:6px;cursor:pointer}

/* ── Divers ── */
.vide{text-align:center;padding:50px 20px;color:var(--text2)}
.vide h2{font-size:18px;color:var(--text);margin-bottom:8px}
.vide p{margin-bottom:18px}
.zoom-barre{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 8px;min-height:28px}
.ecart-obj{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;background:var(--surface2)}
.ecart-obj span{color:var(--text2)} .ecart-obj strong{font-size:15px}
.btn.actif-doux{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.interrupteur{position:relative;display:inline-block;width:34px;height:20px;cursor:pointer;vertical-align:middle}
.interrupteur input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.interrupteur span{position:absolute;inset:0;border-radius:20px;background:var(--border2);transition:background .15s}
.interrupteur span::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+span{background:var(--accent)}
.interrupteur input:checked+span::after{transform:translateX(14px)}
.interrupteur input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tab tr.hyp-off td:not(:first-child):not(:last-child){opacity:.45}
.case-total{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer}
.case-total input{accent-color:var(--accent)}
dialog.dlg-large{width:min(720px,calc(100vw - 24px))}
.tableau-credit{max-height:min(55vh,520px);overflow:auto}
.tableau-credit thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.tableau-credit tr.passe td{color:var(--text3)}
.tableau-credit tr.courant td{background:var(--accent-soft);font-weight:600}
.obj-ligne{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.obj-champs{grid-template-columns:1.3fr 1fr}
.obj-texte .obj-phrase{margin-top:2px}
.obj-texte .ecart-obj{max-width:520px}
@media (max-width:760px){.obj-ligne{grid-template-columns:minmax(0,1fr);gap:12px}}
.g-proj{grid-template-columns:minmax(0,1fr) minmax(0,2fr);margin:16px 0;align-items:stretch}
.g-proj>.carte{margin:0}
@media (max-width:900px){.g-proj{grid-template-columns:minmax(0,1fr)}}
.obj-phrase{font-size:14px;line-height:1.55;color:var(--text2)} .obj-phrase strong{color:var(--text);font-weight:600}
.carte-titre{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px} .carte-titre h2{margin:0}
.pastille-serie{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.nom-serie{display:inline-flex;align-items:center;white-space:nowrap}
.jalons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.jalon{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.jalon .l{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.jalon .v{font-size:18px;font-weight:500;margin-top:3px}
.jalon .s{font-size:12px;color:var(--text3);margin-top:2px}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 36px));pointer-events:none}
.toast button{pointer-events:auto}
@media (max-width:640px){.toasts{top:calc(10px + env(safe-area-inset-top));bottom:auto;left:12px;right:12px;max-width:none}}
.toast{background:var(--text);color:var(--bg);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:flex-start;animation:entree .2s ease}
.toast.erreur{background:var(--neg);color:#fff}
.toast button{border:0;background:none;color:inherit;opacity:.7;cursor:pointer;font-size:16px;line-height:1}
@keyframes entree{from{opacity:0;transform:translateY(6px)}}
.chargement{padding:80px 20px;text-align:center;color:var(--text3)}
details.archives summary{cursor:pointer;color:var(--text2);font-size:13px;margin-top:18px}

/* ── Mobile ── */
@media (max-width:860px){
  .g-2,.g-3{grid-template-columns:1fr}
  .nav a span{display:none}
  .nav a{padding:8px 10px}
}
@media (max-width:640px){
  .entete{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .entete-in{flex-wrap:wrap;padding:8px 14px;gap:8px 10px}
  .marque{flex:1}
  .logo-entete{height:28px}
  .entete-droite{order:2}
  .filtre{order:3;width:100%;justify-content:stretch}
  .filtre button{flex:1}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}

<!-- ═══════════════════════════════════════════════════════════════════
     MODÈLE : calculs purs (aucun accès au DOM ni au stockage).
     Testé en dehors du navigateur — ne rien y ajouter qui touche la page.
     ═══════════════════════════════════════════════════════════════════ -->
<script id="model">
(function (root) {
'use strict';

const TYPES = {
  livret:      { label: 'Livret réglementé',   cat: 'liquidites' },
  courant:     { label: 'Compte courant',      cat: 'liquidites' },
  pea:         { label: 'PEA',                 cat: 'placements' },
  cto:         { label: 'Compte-titres',       cat: 'placements' },
  av:          { label: 'Assurance-vie',       cat: 'placements' },
  pee:         { label: 'Épargne salariale',   cat: 'salariale' },
  per:         { label: 'PER',                 cat: 'salariale' },
  crypto:      { label: 'Crypto',              cat: 'crypto' },
  obligations: { label: 'Prêts / crowdfunding', cat: 'obligations' },
  immobilier:  { label: 'Immobilier',          cat: 'immobilier' },
  autre:       { label: 'Autre',               cat: 'autre' },
};
const CATEGORIES = {
  immobilier:  'Immobilier (net des crédits)',
  liquidites:  'Liquidités',
  placements:  'Bourse & assurance-vie',
  salariale:   'Épargne salariale & retraite',
  crypto:      'Crypto',
  obligations: 'Prêts & crowdfunding',
  autre:       'Autre',
};
const PROPRIETAIRES = { couple: 'Couple', clement: 'Clément', alexandre: 'Alexandre' };
const FILTRES = { foyer: 'Couple', clement: 'Clément', alexandre: 'Alexandre' };

const r2 = n => Math.round((+n || 0) * 100) / 100;
const pad = n => String(n).padStart(2, '0');

// Quote-part d'un compte selon la vue : la seule règle de partage de l'application.
// Vue « Couple » = tout le foyer. Un compte du couple compte pour 50 % dans la vue de chacun.
function part(proprietaire, filtre) {
  if (!filtre || filtre === 'foyer') return 1;
  if (proprietaire === filtre) return 1;
  if (proprietaire === 'clement' || proprietaire === 'alexandre') return 0;
  return 0.5;
}

// ── Dates (toujours en heure locale, format AAAA-MM-JJ / AAAA-MM) ──
function dateISO(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function moisDe(iso) { return String(iso).slice(0, 7); }
function ajouterMois(mois, k) {
  const [y, m] = mois.split('-').map(Number);
  const t = y * 12 + (m - 1) + k;
  return Math.floor(t / 12) + '-' + pad((t % 12 + 12) % 12 + 1);
}
function ecartMois(a, b) { // nombre de mois de a à b
  const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
  return (yb - ya) * 12 + (mb - ma);
}

// ── Crédits ──
// Capital restant dû à un mois donné : la ligne du mois est considérée comme payée.
function crdA(credit, mois) {
  const e = credit.echeancier || [];
  if (!e.length || mois < e[0].m) return +credit.crdInitial || (e[0] ? e[0].crd : 0);
  if (mois > e[e.length - 1].m) return 0;
  let v = e[0].crd;
  for (const r of e) { if (r.m <= mois) v = r.crd; else break; }
  return v;
}
function finCredit(credit) {
  const e = credit.echeancier || [];
  if (!e.length) return null;
  const z = e.find(r => r.crd <= 0.005);
  return z ? z.m : ajouterMois(e[e.length - 1].m, 1);
}
function dettesCompte(credits, compteId, mois) {
  let s = 0;
  for (const c of credits) if (c.compteId === compteId) s += crdA(c, mois);
  return r2(s);
}
// Échéancier à partir d'une saisie simple : CRD de ce mois, taux, mensualité.
function genererEcheancier(crdActuel, tauxAnnuel, mensualite, moisDepart) {
  const tm = (+tauxAnnuel || 0) / 100 / 12;
  let crd = r2(crdActuel);
  if (!(crd > 0)) throw new Error('Le capital restant dû doit être positif.');
  if (!(mensualite > 0)) throw new Error('La mensualité doit être positive.');
  if (crd * tm >= mensualite) throw new Error('La mensualité ne couvre pas les intérêts : vérifie le taux et la mensualité.');
  const ech = [{ m: moisDepart, crd }];
  let m = moisDepart;
  for (let i = 0; i < 720 && crd > 0; i++) {
    const interets = r2(crd * tm), capital = r2(Math.min(crd, mensualite - interets));
    crd = r2(Math.max(0, crd - capital));
    m = ajouterMois(m, 1);
    ech.push({ m, crd, capital, interets });
  }
  return { crdInitial: r2(crdActuel), echeancier: ech };
}

// Lignes à afficher : capital amorti déduit du restant dû quand il n'est pas fourni.
function detailEcheancier(credit) {
  let prec = +credit.crdInitial || 0;
  return (credit.echeancier || []).map((e, i) => {
    const capital = e.capital != null ? +e.capital : (i === 0 && !credit.crdInitial ? null : r2(prec - e.crd));
    prec = e.crd;
    return { m: e.m, crd: e.crd, capital, interets: e.interets != null ? +e.interets : null };
  });
}
// ── Lecture d'un tableau d'amortissement (lignes d'un Excel/CSV) ──
const MOIS_FR = { janv: 1, janvier: 1, fevr: 2, fev: 2, fevrier: 2, mars: 3, avr: 4, avril: 4, mai: 5, juin: 6, juil: 7, juillet: 7, aout: 8, sept: 9, septembre: 9, oct: 10, octobre: 10, nov: 11, novembre: 11, dec: 12, decembre: 12 };
const sansAccent = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function lireNombre(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (v == null) return null;
  let s = String(v).replace(/[\s  €]/g, '');
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function lireMois(v) {
  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + pad(v.getMonth() + 1);
  if (typeof v === 'number' && v > 20000 && v < 80000) { // date série Excel
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1);
  }
  const s = sansAccent(String(v || '').trim());
  let m;
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/))) return m[3] + '-' + pad(+m[2]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{4})$/))) return m[2] + '-' + pad(+m[1]);
  if ((m = s.match(/^(\d{4})[\/.\-](\d{1,2})/))) return m[1] + '-' + pad(+m[2]);
  if ((m = s.match(/^([a-z]+)\.?\s+(\d{4})$/)) && MOIS_FR[m[1]]) return m[2] + '-' + pad(MOIS_FR[m[1]]);
  return null;
}
function parserTableauAmortissement(lignes) {
  const KW_DATE = ['date', 'echeance', 'periode', 'mois'];
  const KW_CRD = ['capital restant', 'restant du', 'crd', 'capital du', 'solde restant', 'encours', 'capital apres'];
  const KW_INT = ['interet'], KW_CAP = ['capital amorti', 'amortissement', 'capital rembourse', 'part capital', 'remboursement capital'];
  let entete = -1, colDate = -1, colCrd = -1, colInt = -1, colCap = -1;
  for (let i = 0; i < Math.min(25, lignes.length) && entete < 0; i++) {
    const cells = (lignes[i] || []).map(c => sansAccent(c == null ? '' : c).trim());
    const cand = [];
    let d = -1;
    cells.forEach((c, j) => {
      if (!c) return;
      if (KW_CRD.some(k => c.includes(k))) cand.push([j, c]);
      else if (d < 0 && KW_DATE.some(k => c.includes(k))) d = j;
    });
    if (d >= 0 && cand.length) {
      const fin = cand.find(([, c]) => /\bfin\b|apres/.test(c));
      const pasDebut = cand.filter(([, c]) => !/debut/.test(c));
      colCrd = (fin || pasDebut[pasDebut.length - 1] || cand[cand.length - 1])[0];
      colDate = d; entete = i;
      cells.forEach((c, j) => {
        if (!c || j === colCrd || j === colDate) return;
        if (colInt < 0 && KW_INT.some(k => c.includes(k)) && !/cumul/.test(c)) colInt = j;
        else if (colCap < 0 && KW_CAP.some(k => c.includes(k)) && !/cumul/.test(c)) colCap = j;
      });
    }
  }
  if (entete < 0) throw new Error('Colonnes « Date » et « Capital restant dû » introuvables dans le fichier.');
  const parMois = new Map();
  for (let i = entete + 1; i < lignes.length; i++) {
    const l = lignes[i] || [];
    const m = lireMois(l[colDate]), crd = lireNombre(l[colCrd]);
    if (m && crd != null && crd >= 0) {
      const ligne = { m, crd: r2(crd) };
      const it = colInt >= 0 ? lireNombre(l[colInt]) : null, ca = colCap >= 0 ? lireNombre(l[colCap]) : null;
      if (it != null) ligne.interets = r2(it);
      if (ca != null) ligne.capital = r2(ca);
      parMois.set(m, ligne);
    }
  }
  const ech = [...parMois.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([, l]) => l);
  if (ech.length < 2) throw new Error('Aucune échéance lisible trouvée sous l’en-tête.');
  return { crdInitial: ech[0].crd, echeancier: ech };
}

// ── Situation actuelle ──
const parOrdre = (a, b) => ((a.ordre ?? 0) - (b.ordre ?? 0)) || String(a.nom).localeCompare(String(b.nom), 'fr');
function comptesActifs(state) { return state.comptes.filter(c => c.actif !== false).sort(parOrdre); }
function totaliser(lignes) {
  let brut = 0, dettes = 0, net = 0;
  const parCategorie = {};
  for (const l of lignes) {
    brut += l.brut * l.part; dettes += l.dettes * l.part; net += l.net * l.part;
    const cat = (TYPES[l.compte.type] || TYPES.autre).cat;
    parCategorie[cat] = (parCategorie[cat] || 0) + l.net * l.part;
  }
  Object.keys(parCategorie).forEach(k => { parCategorie[k] = r2(parCategorie[k]); });
  return { lignes, brut: r2(brut), dettes: r2(dettes), net: r2(net), parCategorie };
}
function situation(state, filtre, iso = dateISO()) {
  const mois = moisDe(iso);
  return totaliser(comptesActifs(state).map(c => {
    const brut = +c.valeur || 0, dettes = dettesCompte(state.credits, c.id, mois);
    return { compte: c, brut, dettes, net: r2(brut - dettes), part: part(c.proprietaire, filtre) };
  }));
}

// ── Historique ──
function snapshotTotaux(state, snap, filtre) {
  const parId = new Map(state.comptes.map(c => [c.id, c]));
  const ids = new Set([...Object.keys(snap.valeurs || {}), ...Object.keys(snap.dettes || {})]);
  return totaliser([...ids].map(id => {
    const c = parId.get(id) || { id, nom: '(compte supprimé)', type: 'autre', proprietaire: 'couple', ordre: 999 };
    const brut = +(snap.valeurs || {})[id] || 0, dettes = +(snap.dettes || {})[id] || 0;
    return { compte: c, brut, dettes, net: r2(brut - dettes), part: part(c.proprietaire, filtre) };
  }).sort((a, b) => parOrdre(a.compte, b.compte)));
}
function historique(state, filtre) {
  return [...state.snapshots].sort((a, b) => a.date.localeCompare(b.date))
    .map(s => Object.assign({ snapshot: s }, snapshotTotaux(state, s, filtre)));
}
// Snapshot « figé » : valeurs saisies + dettes calculées à la date.
function construireSnapshot(state, date, valeurs) {
  const mois = moisDe(date), dettes = {};
  for (const c of state.comptes) {
    if (!(c.id in valeurs)) continue;
    const d = dettesCompte(state.credits, c.id, mois);
    if (d) dettes[c.id] = d;
  }
  const v = {};
  Object.keys(valeurs).forEach(id => { v[id] = r2(valeurs[id]); });
  return { id: date, date, valeurs: v, dettes };
}

// ── Projection ──
function aDesHypotheses(state) { return comptesActifs(state).some(c => +c.taux || +c.versement); }
// Valeur future d'un capital v et d'un versement mensuel vm au taux annuel t (%), après k mois.
function valeurFuture(v, vm, t, k) {
  const r = Math.pow(1 + (+t || 0) / 100, 1 / 12) - 1; // taux mensuel équivalent
  if (Math.abs(r) < 1e-12) return v + vm * k;
  const f = Math.pow(1 + r, k);
  return v * f + vm * (f - 1) / r;
}
// Taux et versement propres à un compte (anciennes données ; plus saisis dans l'interface).
function croissance(c, k) {
  const v = +c.valeur || 0, t = +c.taux || 0, vm = +c.versement || 0;
  if (!t && !vm) return v;
  return valeurFuture(v, vm, t, k);
}
// Projection de base : valeurs actuelles figées, seuls les crédits se remboursent.
// k = 0 correspond exactement à la situation du jour : la courbe part du net réel.
function projection(state, filtre, horizonMois, iso = dateISO()) {
  const m0 = moisDe(iso), comptes = comptesActifs(state), pts = [];
  for (let k = 0; k <= horizonMois; k++) {
    const mois = ajouterMois(m0, k);
    let brut = 0, dettes = 0, net = 0;
    for (const c of comptes) {
      const p = part(c.proprietaire, filtre);
      if (!p) continue;
      const b = croissance(c, k), d = dettesCompte(state.credits, c.id, mois);
      brut += b * p; dettes += d * p; net += r2(b - d) * p; // même calcul que situation()
    }
    pts.push({ mois, k, brut: r2(brut), dettes: r2(dettes), net: r2(net) });
  }
  return pts;
}

// ── Hypothèses de placement (comme la V1) ──
// { id, nom, debut: 'AAAA-MM', montantInitial, versementMensuel, versementAnnuel, rendement (%/an), duree (ans | null), visible }
// Rendement annuel effectif : 100 € placés à 6 % valent 106 € au bout de 12 mois (1,06^n).
// Un versement fait en cours d'année rapporte au prorata, au taux mensuel équivalent (1,06^(1/12) − 1) ;
// versement annuel en fin de chaque année ;
// après la durée, plus de versement mais le capital continue de rapporter.
function gainHypothese(h, mois) {
  const t = ecartMois(h.debut, mois); // mois écoulés depuis le début
  if (t <= 0) return 0;
  const rm = Math.pow(1 + (+h.rendement || 0) / 100, 1 / 12) - 1; // équivalent mensuel exact du taux annuel
  const v0 = +h.montantInitial || 0, vm = +h.versementMensuel || 0, va = +h.versementAnnuel || 0;
  const dureeMois = h.duree ? Math.round(+h.duree * 12) : null;
  const actif = dureeMois ? Math.min(t, dureeMois) : t;
  let c;
  if (Math.abs(rm) > 1e-12) {
    const f = Math.pow(1 + rm, actif);
    c = v0 * f + vm * (f - 1) / rm;
    const n = Math.floor(actif / 12);
    if (va > 0 && n > 0) { const fa = Math.pow(1 + rm, 12); c += va * Math.pow(1 + rm, actif - 12 * n) * (Math.pow(fa, n) - 1) / (fa - 1); }
  } else c = v0 + vm * actif + va * Math.floor(actif / 12);
  const apres = dureeMois ? Math.max(0, t - dureeMois) : 0;
  if (apres > 0) c *= Math.pow(1 + rm, apres);
  return r2(c);
}
// Total versé (sans les intérêts) à un mois donné : capital initial + mensualités + versements annuels.
function verseHypothese(h, mois) {
  const t = ecartMois(h.debut, mois);
  if (t <= 0) return 0;
  const actif = h.duree ? Math.min(t, Math.round(+h.duree * 12)) : t;

function courbeHypothese(base, h, filtre) {

// Droite entre le premier snapshot (date et net du couple) et le montant visé à l'échéance.

function creerStoreLocal(onData) {
  const CLE = 'apogee-v2-donnees';

    enregistrerCompte: op(c => upsert('comptes', c)),

    estSynchronise: () => true,
    envoisEnAttente: () => false,

  };
}

async function creerStoreFirebase(db, fs, uid, onData) {
  const { collection, doc, onSnapshot, setDoc, writeBatch, getDocs } = fs;

  const estSynchronise = () => Object.values(serveur).every(Boolean);

  let sauvegardeFaite = false;
  const emettre = () => { if (Object.values(charge).every(Boolean)) onData(clone(data)); };
  const surErreur = e => { console.error(e); statut({ etat: 'erreur', message: messageErreur(e) }); toast('Lecture impossible : ' + messageErreur(e), 'erreur'); };

  for (const col of COLS) {
    desabonnements.push(onSnapshot(collection(db, 'users', uid, col), { includeMetadataChanges: true }, snap => {
      data[col] = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      attente[col] = snap.metadata.hasPendingWrites; charge[col] = true;
      if (!snap.metadata.fromCache) serveur[col] = true;
      majStatut(); emettre(); apresChargement();
    }, surErreur));
  }
  desabonnements.push(onSnapshot(ref('reglages', 'principal'), { includeMetadataChanges: true }, snap => {
    data.reglages = snap.exists() ? snap.data() : {};

    if (!snap.metadata.fromCache) serveur.reglages = true;

  const lot = ops => {

    const exp = { format: 'apogee-v2', version: 1, exporteLe: new Date().toISOString(), comptes: data.comptes, credits: data.credits, snapshots: data.snapshots, reglages: data.reglages || {} };

  };

// ── Tableau de bord ───────────────────────────────────────────────────
function pageTableau() {
  if (!state.comptes.length) return vueVide();
  const s = M.situation(state, ui.filtre);
  const hist = M.historique(state, ui.filtre);
  const dernier = hist[hist.length - 1], avant = hist[hist.length - 2], premier = hist[0];
  const pastilles = [];
  if (dernier && Math.abs(s.net - dernier.net) >= 1) pastilles.push(`Depuis le ${dateCourte(dernier.snapshot.date)} : <strong class="${classeSigne(s.net - dernier.net)}">${eurSigne(s.net - dernier.net)}</strong>`);
  if (dernier && avant) pastilles.push(`Dernière mise à jour : <strong class="${classeSigne(dernier.net - avant.net)}">${eurSigne(dernier.net - avant.net)}</strong>`);
  if (dernier && premier && premier !== dernier) pastilles.push(`Depuis ${moisLong(M.moisDe(premier.snapshot.date))} : <strong class="${classeSigne(dernier.net - premier.net)}">${eurSigne(dernier.net - premier.net)}</strong>`);

  const cats = Object.entries(s.parCategorie).filter(([, v]) => Math.abs(v) >= 0.5).sort((a, b) => b[1] - a[1]);
  const totalPos = cats.reduce((t, [, v]) => t + Math.max(0, v), 0) || 1;
  const repartition = cats.map(([k, v]) => `
    <div class="rep-ligne"><span>${esc(M.CATEGORIES[k] || k)}</span><span class="num">${eur(v)}</span><span class="rep-pct">${(Math.max(0, v) / totalPos * 100).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %</span>
    <div class="rep-barre"><span style="width:${Math.max(0, v) / totalPos * 100}%;background:var(--cat-${k})"></span></div></div>`).join('');

  let personnes = '';
  if (ui.filtre === 'foyer') {
    const c = M.situation(state, 'clement').net, a = M.situation(state, 'alexandre').net;
    personnes = `<div class="sep"></div><div class="sous-titre">Par personne <span class="muted" style="font-weight:400">(comptes du couple partagés 50/50)</span></div>
      <div class="repartition">${[['Clément', c], ['Alexandre', a]].map(([n, v]) => `<div class="rep-ligne"><span>${n}</span><span class="num">${eur(v)}</span><span class="rep-pct"></span></div>`).join('')}</div>`;
  }

  const obj = objectifCourant();
  const ecObj = obj && ui.filtre === 'foyer' ? ecartObjectif(M.trajectoireObjectif(state)) : null;
  const objectif = obj ? `<div class="carte"><h2>Objectif <span class="muted num" style="font-weight:400">${eur(obj.montant)} · ${moisLong(M.echeanceObjectif(obj))}</span></h2>
      <div class="objectif-barre"><span style="width:${Math.min(100, Math.max(0, s.net / obj.montant * 100))}%"></span></div>
      <div class="sous">${pct(s.net / obj.montant * 100)} atteint · reste ${eur(Math.max(0, obj.montant - s.net))}</div>
      ${ecObj ? `<div class="ecart-obj ${ecObj.ecart >= 0 ? 'pos' : 'neg'}" style="margin-top:10px"><span>Vs trajectoire au ${dateCourte(ecObj.date)}</span><strong class="num">${eurSigne(ecObj.ecart)}</strong></div>` : ''}
      <a href="#/projection" class="sous" style="display:inline-block;margin-top:8px">Modifier dans Projection →</a></div>` : '';

  const jours = dernier ? joursDepuis(dernier.snapshot.date) : null;
  return `
    <div class="grille g-2">
      <div class="carte hero">
        <div class="hero-label">Patrimoine net · ${esc(filtreLib())}</div>
        <div class="hero-valeur num">${eur(s.net)}</div>
        <div class="hero-sous">Brut <span class="num">${eur(s.brut)}</span> · Crédits <span class="num">−${eur(s.dettes)}</span></div>
        <div class="pastilles">${pastilles.map(p => `<span class="pastille">${p}</span>`).join('')}</div>
        <div class="graph graph-hero"><canvas id="g-tableau"></canvas></div>
      </div>
      <div class="pile">
        <div class="carte maj-cta">
          <div><div style="font-weight:600">Mise à jour mensuelle</div>
          <div class="sous">${dernier ? `Dernière le ${dateFr(dernier.snapshot.date)}${jours > 0 ? ` (il y a ${jours} jour${jours > 1 ? 's' : ''})` : ' (aujourd’hui)'}` : 'Aucune pour l’instant'}</div></div>
          <a class="btn btn-primaire" href="#/maj">Mettre à jour</a>
        </div>
        <div class="carte"><h2>Répartition</h2><div class="repartition">${repartition || '<span class="muted">—</span>'}</div>${personnes}</div>
        ${objectif}
      </div>
    </div>`;
}
function graphTableau() {
  const el = $('#g-tableau');
  if (!el || typeof Chart === 'undefined') return;
  const hist = M.historique(state, ui.filtre);
  if (hist.length < 2) { el.parentElement.innerHTML = '<p class="muted" style="padding-top:60px;text-align:center">La courbe apparaîtra après deux mises à jour.</p>'; return; }
  const parMois = serieMensuelle(hist);
  const m0 = M.moisDe(hist[0].snapshot.date), m1 = M.moisDe(hist[hist.length - 1].snapshot.date);
  const mois = Array.from({ length: M.ecartMois(m0, m1) + 1 }, (_, i) => M.ajouterMois(m0, i));
  const acc = css('--accent');
  charts.tableau = new Chart(el, {
    type: 'line',
    data: { labels: mois.map(moisFr), datasets: [{ label: 'Patrimoine net', data: mois.map(m => parMois.has(m) ? parMois.get(m).net : null), spanGaps: true,
      borderColor: acc, backgroundColor: acc + '22', fill: true, tension: .25, pointRadius: 3, pointBackgroundColor: acc, borderWidth: 2 }] },
    options: optionsGraph(),
  });
}

// ── Mise à jour mensuelle ─────────────────────────────────────────────
const CLE_BROUILLON = 'brouillon-maj';
function sauverBrouillon() { if (ui.maj) setPref(CLE_BROUILLON, JSON.stringify({ date: ui.maj.date, valeurs: ui.maj.valeurs, modifie: ui.maj.modifie, le: Date.now() })); }
function effacerBrouillon() { try { localStorage.removeItem('apogee.' + CLE_BROUILLON); } catch {} }
function initMaj() {
  const actifs = M.comptesActifs(state);
  if (!ui.maj) {
    let b = null; try { b = JSON.parse(pref(CLE_BROUILLON, 'null')); } catch {}
    // Un brouillon de moins de 30 jours avec des montants modifiés est repris (onglet fermé, téléphone en veille…)
    if (b && b.modifie && Date.now() - b.le < 30 * 864e5) ui.maj = { date: b.date, valeurs: b.valeurs || {}, modifie: true, restaure: true };
    else ui.maj = { date: M.dateISO(), valeurs: {} };
  }
  actifs.forEach(c => { if (!(c.id in ui.maj.valeurs)) ui.maj.valeurs[c.id] = saisie(c.valeur); });
}
function snapAvant(date) { return snapsTries().filter(s => s.date < date).pop() || null; }
function pageMaj() {
  if (!state.comptes.length) return vueVide();
  initMaj();
  const actifs = M.comptesActifs(state);
  const prec = snapAvant(ui.maj.date);
  const existe = state.snapshots.find(s => s.date === ui.maj.date);
  const mois = M.moisDe(ui.maj.date);
  const bandeauBrouillon = ui.maj.restaure ? `<div class="bandeau">Saisie en cours reprise là où tu l’avais laissée. « Annuler » pour repartir de zéro.</div>` : '';
  const groupes = ['couple', 'clement', 'alexandre'].map(p => [p, actifs.filter(c => c.proprietaire === p)]).filter(([, l]) => l.length);
  const lignes = groupes.map(([p, liste]) => `
    <div class="section-titre"><span>${esc(M.PROPRIETAIRES[p])}</span></div>
    <div class="carte" style="padding:6px 16px">
      <div class="maj-ligne maj-entete"><span>Compte</span><span class="d" style="text-align:right">Précédent</span><span style="text-align:right">Valeur au ${dateCourte(ui.maj.date)}</span><span style="text-align:right">Variation</span></div>
      ${liste.map(c => {
        const pv = prec && prec.valeurs[c.id] != null ? prec.valeurs[c.id] : null;
        const dettes = M.dettesCompte(state.credits, c.id, mois);
        const sousLigne = c.type === 'immobilier' && dettes
          ? `Valeur du bien · crédits au ${moisFr(mois)} : <span class="num">−${eur(dettes)}</span> (automatique)`
          : esc(typeLib(c.type) + (c.groupe ? ' · ' + c.groupe : ''));
        return `<div class="maj-ligne">
          <div class="col-nom"><div class="nom-compte">${esc(c.nom)}</div><div class="sous">${sousLigne}</div></div>
          <div class="col-prec num muted" style="text-align:right">${pv != null ? eur(pv, 2) : '—'}</div>
          <label class="champ-montant col-champ" data-champ="${esc(c.id)}"><input inputmode="decimal" autocomplete="off" data-maj="${esc(c.id)}" value="${esc(ui.maj.valeurs[c.id])}" aria-label="${esc(c.nom)}"><span>€</span></label>
          <div class="col-delta num" style="text-align:right" data-delta="${esc(c.id)}"></div>
        </div>`;
      }).join('')}
    </div>`).join('');
  return `
    <div class="titre-page"><div><h1>Mise à jour mensuelle</h1><p>Corrige les montants qui ont bougé ; les crédits se calculent tout seuls.</p></div>
      <div class="champ" style="width:170px"><label for="maj-date">Date du snapshot</label><input type="date" id="maj-date" value="${ui.maj.date}" max="${M.dateISO()}"></div></div>
    ${bandeauBrouillon}
    ${existe ? `<div class="bandeau warn">Un snapshot existe déjà le ${dateFr(ui.maj.date)} : l’enregistrer le remplacera.</div>` : ''}
    ${lignes}
    <div class="maj-pied">
      <div class="total"><div class="sous">Patrimoine net du couple à cette date</div><strong class="num" id="maj-total"></strong> <span class="num" id="maj-total-delta"></span></div>
      <div class="maj-boutons"><button class="btn" data-action="maj-annuler">Annuler</button>
      <button class="btn btn-primaire" data-action="maj-enregistrer">Enregistrer le snapshot</button></div>
    </div>`;
}
function rafraichirMaj() {
  if (ui.page !== 'maj' || !ui.maj) return;
  const prec = snapAvant(ui.maj.date);
  const valeurs = {};
  let ok = true;
  M.comptesActifs(state).forEach(c => {
    const brut = ui.maj.valeurs[c.id];
    const v = M.lireNombre(brut);
    const champ = $(`[data-champ="${CSS.escape(c.id)}"]`);
    if (champ) champ.classList.toggle('invalide', v == null);
    if (v == null) { ok = false; return; }
    valeurs[c.id] = v;
    const d = $(`[data-delta="${CSS.escape(c.id)}"]`);
    const pv = prec && prec.valeurs[c.id] != null ? prec.valeurs[c.id] : null;
    if (d) { const diff = pv == null ? null : v - pv; d.className = 'col-delta num ' + (diff == null ? 'muted' : classeSigne(diff)); d.textContent = diff == null ? 'nouveau' : (Math.abs(diff) < 0.005 ? '=' : eurSigne(diff, 2)); }
  });
  const total = $('#maj-total'), delta = $('#maj-total-delta');
  if (!total) return;
  if (!ok) { total.textContent = 'Montant invalide'; delta.textContent = ''; return; }
  const snap = M.construireSnapshot(state, ui.maj.date, valeurs);
  const net = M.snapshotTotaux(state, snap, 'foyer').net;
  total.textContent = eur(net);
  if (prec) { const dn = net - M.snapshotTotaux(state, prec, 'foyer').net; delta.className = 'num ' + classeSigne(dn); delta.textContent = `${eurSigne(dn)} vs ${dateCourte(prec.date)}`; }
}
async function enregistrerMaj() {
  const date = ui.maj.date;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > M.dateISO()) return toast('Date invalide (pas de date future).', 'erreur');
  const actifs = M.comptesActifs(state), valeurs = {};
  for (const c of actifs) {
    const v = M.lireNombre(ui.maj.valeurs[c.id]);
    if (v == null) { toast(`Montant invalide pour « ${c.nom} ».`, 'erreur'); $(`[data-maj="${CSS.escape(c.id)}"]`)?.focus(); return; }
    valeurs[c.id] = v;
  }
  if (!await confirmerSiNonSynchronise('Enregistrer le snapshot')) return;
  if (state.snapshots.some(s => s.date === date) && !await confirmer('Remplacer le snapshot ?', `Un snapshot existe déjà le ${esc(dateFr(date))}. Il sera remplacé par ces valeurs.`, 'Remplacer')) return;
  const snap = M.construireSnapshot(state, date, valeurs);
  snap.enregistreLe = new Date().toISOString();
  // Les valeurs actuelles des comptes ne suivent que le snapshot le plus récent (pas un rattrapage passé).
  const plusRecent = !state.snapshots.some(s => s.date > date);
  const majValeurs = plusRecent ? Object.fromEntries(actifs.filter(c => M.r2(c.valeur) !== M.r2(valeurs[c.id])).map(c => [c.id, M.r2(valeurs[c.id])])) : {};
  ecrire(store.enregistrerSnapshot(snap, majValeurs)).then(() => {}, () => {});
  ui.maj = null; effacerBrouillon(); ui.histSel = date; ui.histEdition = false;
  toast(`Snapshot du ${dateFr(date)} enregistré.`);
  location.hash = '#/historique';
}

// ── Historique ────────────────────────────────────────────────────────
function pageHistorique() {
  const hist = M.historique(state, ui.filtre);
  if (!hist.length) return state.comptes.length
    ? `<div class="carte vide"><h2>Pas encore d’historique</h2><p>Chaque mise à jour mensuelle ajoute un point ici.</p><a class="btn btn-primaire" href="#/maj">Faire la première mise à jour</a></div>`
    : vueVide();
  const premier = hist[0], dernier = hist[hist.length - 1];
  const nbMois = Math.max(1, M.ecartMois(M.moisDe(premier.snapshot.date), M.moisDe(dernier.snapshot.date)));
  if (!ui.histSel || !hist.some(h => h.snapshot.date === ui.histSel)) ui.histSel = dernier.snapshot.date;
  const traj = ui.filtre === 'foyer' && objectifCourant() ? M.trajectoireObjectif(state) : null;
  const lignes = [...hist].reverse().map((h, i, arr) => {
    const p = arr[i + 1], d = p ? h.net - p.net : null;
    const o = traj ? traj.valeurA(M.moisDe(h.snapshot.date)) : null;
    return `<tr class="cliquable ${h.snapshot.date === ui.histSel ? 'selection' : ''}" data-action="hist-select" data-date="${h.snapshot.date}">
      <td>${dateFr(h.snapshot.date)}</td><td class="d num">${eur(h.net)}</td>
      <td class="d num ${d == null ? 'muted' : classeSigne(d)}">${d == null ? '—' : eurSigne(d)}</td>
      ${traj ? `<td class="d num ${o == null ? 'muted' : classeSigne(h.net - o)}">${o == null ? '—' : eurSigne(h.net - o)}</td>` : ''}</tr>`;
  }).join('');
  return `
    <div class="titre-page"><div><h1>Historique</h1><p>Vue ${esc(filtreLib())} · ${hist.length} mise${hist.length > 1 ? 's' : ''} à jour depuis ${moisLong(M.moisDe(premier.snapshot.date))}</p></div></div>
    <div class="carte">
      <div class="pastilles" style="margin:0 0 14px">
        <span class="pastille">Évolution : <strong class="${classeSigne(dernier.net - premier.net)}">${eurSigne(dernier.net - premier.net)}</strong></span>
        ${hist.length > 1 ? `<span class="pastille">Moyenne : <strong class="${classeSigne(dernier.net - premier.net)}">${eurSigne((dernier.net - premier.net) / nbMois)}</strong> / mois</span>` : ''}
      </div>
      ${enteteZoom('hist', 'zoom-hist')}<div class="graph-grand"><canvas id="g-hist"></canvas></div>
    </div>
    <div class="grille g-2" style="margin-top:16px">
      <div class="carte"><h2>Snapshots</h2><div class="tab-scroll"><table class="tab"><thead><tr><th>Date</th><th class="d">Net</th><th class="d">Variation</th>${traj ? '<th class="d">Vs objectif</th>' : ''}</tr></thead><tbody>${lignes}</tbody></table></div></div>
      <div class="carte" id="hist-detail">${detailSnapshot(hist)}</div>
    </div>`;
}
function detailSnapshot(hist) {
  const i = hist.findIndex(h => h.snapshot.date === ui.histSel);
  if (i < 0) return '';
  const h = hist[i], p = hist[i - 1];
  const precParId = new Map(p ? p.lignes.map(l => [l.compte.id, l]) : []);
  if (ui.histEdition) {
    return `<h2>Modifier le ${dateFr(h.snapshot.date)}</h2>
      <p class="sous" style="margin-bottom:10px">Valeurs brutes saisies ce jour-là (les crédits restent figés à cette date).</p>
      ${h.lignes.map(l => `<div class="maj-ligne" style="grid-template-columns:1fr 150px">
        <div><div class="nom-compte">${esc(l.compte.nom)}</div><div class="sous">${l.dettes ? 'Crédits : −' + eur(l.dettes, 2) : esc(typeLib(l.compte.type))}</div></div>
        <label class="champ-montant"><input inputmode="decimal" data-edit="${esc(l.compte.id)}" value="${esc(saisie(l.brut))}"><span>€</span></label></div>`).join('')}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" data-action="hist-annuler">Annuler</button><button class="btn btn-primaire" data-action="hist-sauver">Enregistrer</button></div>`;
  }
  const d = p ? h.net - p.net : null;
  const lignes = h.lignes.filter(l => l.part > 0).map(l => {
    const pl = precParId.get(l.compte.id), v = l.net * l.part, pv = pl ? pl.net * pl.part : null;
    const dv = pv == null ? null : v - pv;
    return `<tr><td><div class="nom-compte">${esc(l.compte.nom)}</div>${l.part < 1 ? '<div class="sous">quote-part 50 %</div>' : ''}</td>
      <td class="d num">${eur(v)}</td><td class="d num ${dv == null ? 'muted' : classeSigne(dv)}">${dv == null ? '—' : (Math.abs(dv) < 0.5 ? '=' : eurSigne(dv))}</td></tr>`;
  }).join('');
  return `<h2><span>${dateFr(h.snapshot.date)}</span><span class="num">${eur(h.net)}</span></h2>
    <p class="sous" style="margin:-6px 0 12px">${p ? `<span class="${classeSigne(d)}">${eurSigne(d)}</span> depuis le ${dateCourte(p.snapshot.date)} · ` : ''}brut ${eur(h.brut)} · crédits −${eur(h.dettes)}</p>
    <div class="tab-scroll"><table class="tab"><thead><tr><th>Compte (net)</th><th class="d">Valeur</th><th class="d">Variation</th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-petit btn-danger" data-action="hist-supprimer">Supprimer</button>
      <button class="btn btn-petit" data-action="hist-modifier">Modifier les valeurs</button></div>`;
}

// ── Zoom des graphiques ───────────────────────────────────────────────
// Molette ou pincement pour zoomer, glisser pour se déplacer. L'axe vertical se recale
// sur la partie visible pour bien lire l'écart entre les courbes.
if (typeof Chart !== 'undefined' && window.ChartZoom) { try { Chart.register(window.ChartZoom); } catch {} }
function ajusterAxeY(chart) {
  const x = chart.scales.x, i0 = Math.max(0, Math.floor(x.min)), i1 = Math.ceil(x.max);
  let lo = Infinity, hi = -Infinity;
  chart.data.datasets.forEach((ds, k) => {
    if (!chart.isDatasetVisible(k)) return;
    for (let i = i0; i <= i1; i++) { const v = ds.data[i]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  });
  if (lo === Infinity) return;
  // bornes arrondies à un pas « rond » pour des graduations lisibles
  const brut = Math.max((hi - lo) / 5, 100), p10 = Math.pow(10, Math.floor(Math.log10(brut)));
  const pas = [1, 2, 2.5, 5, 10].map(x => x * p10).find(x => x >= brut);
  chart.options.scales.y.min = Math.floor(lo / pas) * pas; chart.options.scales.y.max = Math.ceil(hi / pas) * pas;
  chart.update('none');
}
function activerZoom(opts, idBouton) {
  if (!window.ChartZoom) return opts;
  const apres = ({ chart }) => { ajusterAxeY(chart); const b = $('#' + idBouton); if (b) b.hidden = false; };
  opts.plugins.zoom = {
    zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x', onZoomComplete: apres },
    pan: { enabled: true, mode: 'x', onPanComplete: apres },
    limits: { x: { minRange: 2 } },
  };
  return opts;
}
function reinitZoom(nom, idBouton) {
  const c = charts[nom]; if (!c) return;
  if (c.resetZoom) c.resetZoom('none');
  c.options.scales.y.min = undefined; c.options.scales.y.max = undefined;
  c.update('none');
  const b = $('#' + idBouton); if (b) b.hidden = true;
}

function graphProjection() {

let promesseSheetJS = null;
function chargerSheetJS() {
  if (window.XLSX) return Promise.resolve();

    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => { promesseSheetJS = null; ko(new Error('Impossible de charger le lecteur Excel (connexion ?).')); };
    document.head.appendChild(s);
  });
}

function exporterFichier(suffixe = '') {

  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `apogee-v2-${M.dateISO()}${suffixe}.json` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Remplacement complet (import d'un fichier ou restauration d'une sauvegarde automatique).
async function remplacerDonnees(d, titre, libelle) {
  if (!store.estSynchronise()) return toast('Connexion à Firebase en cours : attends que le statut indique « Synchronisé », puis recommence.', 'erreur');
  const dernierDate = x => x.snapshots.reduce((m, s) => s.date > m ? s.date : m, '');
  const net = d.snapshots.length ? M.historique(d, 'foyer').pop() : null;
  const aDesDonnees = state.comptes.length || state.snapshots.length;
  const plusAncien = aDesDonnees && (dernierDate(d) < dernierDate(state) || d.snapshots.length < state.snapshots.length);
  let msg = `Le fichier contient <strong>${d.comptes.length} comptes</strong>, ${d.credits.length} crédits et <strong>${d.snapshots.length} snapshots</strong>${net ? ` (dernier : ${esc(dateFr(net.snapshot.date))}, net ${esc(eur(net.net))})` : ''}.`;
  if (aDesDonnees) msg += `<br><br>Toutes les données actuelles (${state.comptes.length} comptes, ${state.snapshots.length} snapshots${dernierDate(state) ? `, dernier le ${esc(dateFr(dernierDate(state)))}` : ''}) seront remplacées.`;
  if (plusAncien) msg += `<br><br><strong class="neg">Attention : ce fichier est plus ancien que tes données actuelles. Les snapshots plus récents seront perdus.</strong>`;
  if (aDesDonnees) msg += `<br><br>Par sécurité, une copie des données actuelles va être téléchargée et gardée dans les sauvegardes automatiques.`;
  if (!await confirmer(titre, msg, libelle, aDesDonnees)) return;
  if (aDesDonnees) exporterFichier('-avant-import');
  try { await ecrire(store.remplacerTout(d)); toast('Données remplacées.'); location.hash = '#/tableau'; } catch {}
}
function importerFichier() {
  const inp = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let d, brut;
    try { brut = JSON.parse(await f.text()); } catch (e) { return toast('Import impossible : fichier JSON illisible.', 'erreur'); }
    if (brut && brut.format === 'apogee-v2-credits') return completerCredits(brut);
    try { d = M.validerDonnees(brut); }
    catch (e) { return toast('Import impossible : ' + e.message, 'erreur'); }
    remplacerDonnees(d, 'Importer cette sauvegarde ?', 'Importer');
  };
  inp.click();
}
// Fichier « complément » : ajoute le détail (intérêts, capital amorti) aux tableaux d'amortissement
// existants, sans rien toucher d'autre. Refusé si le restant dû ne correspond pas mois par mois.
async function completerCredits(fichier) {
  const maj = [], ignores = [];
  for (const c of fichier.credits || []) {
    const ex = state.credits.find(x => x.id === c.id);
    const parMois = new Map((ex ? ex.echeancier : []).map(e => [e.m, e.crd]));
    const ok = ex && Array.isArray(c.echeancier) && c.echeancier.length === ex.echeancier.length && c.echeancier.every(e => parMois.has(e.m) && Math.abs(parMois.get(e.m) - e.crd) < 0.02);
    if (ok) maj.push(Object.assign({}, ex, { echeancier: c.echeancier })); else ignores.push(c.nom || c.id);
  }
  if (!maj.length) return toast('Aucun crédit correspondant : rien n’a été modifié.', 'erreur');
  if (!await confirmerSiNonSynchronise('Compléter les tableaux')) return;
  if (!await confirmer('Compléter les tableaux d’amortissement ?', `Intérêts et capital remboursé ajoutés pour : <strong>${maj.map(c => esc(c.nom)).join(', ')}</strong>.${ignores.length ? `<br><br>Ignorés (ne correspondent pas) : ${ignores.map(esc).join(', ')}.` : ''}<br><br>Rien d’autre n’est modifié.`, 'Compléter')) return;
  try { await Promise.all(maj.map(c => ecrire(store.enregistrerCredit(c)))); toast(`${maj.length} tableau${maj.length > 1 ? 'x' : ''} complété${maj.length > 1 ? 's' : ''}.`); } catch {}
}

const PAGES = { tableau: pageTableau, maj: pageMaj, historique: pageHistorique, projection: pageProjection, comptes: pageComptes, reglages: pageReglages };
const GRAPHS = { tableau: graphTableau, historique: graphHistorique, projection: graphProjection };

function rendre() {
  if (!state) return;
  const page = $('#page');
  const scroll = window.scrollY;
  const ae = document.activeElement;
  const focus = ae && ae.id && page.contains(ae) ? { id: ae.id, valeur: ae.type === 'checkbox' ? null : ae.value } : null;
  detruireGraphs();
  page.innerHTML = PAGES[ui.page]();
  $$('#nav a, .btn-icone[data-page]').forEach(a => a.classList.toggle('actif', a.dataset.page === ui.page));
  $$('#filtre button').forEach(b => b.classList.toggle('actif', b.dataset.filtre === ui.filtre));
  $('#filtre').hidden = ['maj', 'reglages'].includes(ui.page);
  try { GRAPHS[ui.page] && GRAPHS[ui.page](); } catch (e) { console.error(e); }
  if (ui.page === 'maj') rafraichirMaj();
  window.scrollTo(0, scroll);
  if (focus) {
    const f = document.getElementById(focus.id);
    if (f) {
      const enCours = focus.valeur != null && f.value !== focus.valeur; // saisie en cours : on la garde
      if (enCours) f.value = focus.valeur;
      f.focus({ preventScroll: true });
      if (!enCours && f.select && f.type !== 'checkbox') f.select();
    }
  }
}

}

  },
  'deconnexion': async () => {
    if (store.envoisEnAttente() && !await confirmer('Modifications pas encore envoyées', 'Certaines modifications n’ont pas encore été confirmées par Firebase. Si tu te déconnectes maintenant, elles risquent d’être perdues.', 'Se déconnecter quand même', true)) return;
    store.deconnecter && store.deconnecter();
  },
  'sauvegardes-voir': afficherSauvegardes,
  'sauvegarde-maintenant': async () => { try { await ecrire(store.sauvegarderMaintenant()); toast('Sauvegarde enregistrée.'); afficherSauvegardes(); } catch {} },
  'sauvegarde-telecharger': el => {
    const b = sauvegardeParId(el.dataset.id); if (!b) return;
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([b.donnees], { type: 'application/json' })), download: `apogee-v2-sauvegarde-${(b.creeLe || '').slice(0, 10)}.json` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  'sauvegarde-restaurer': el => {
    const b = sauvegardeParId(el.dataset.id); if (!b) return;
    let d; try { d = M.validerDonnees(JSON.parse(b.donnees)); } catch (e) { return toast('Sauvegarde illisible : ' + e.message, 'erreur'); }
    remplacerDonnees(d, `Restaurer la sauvegarde du ${dateFr((b.creeLe || '').slice(0, 10))} ?`, 'Restaurer');
  },
  'horizon': el => { ui.horizon = +el.dataset.h; setPref('horizon', ui.horizon); rendre(); },
  'maj-annuler': async () => { if (await confirmer('Abandonner la mise à jour ?', 'Les montants saisis seront perdus.', 'Abandonner', true)) { ui.maj = null; effacerBrouillon(); location.hash = '#/tableau'; } },
  'maj-enregistrer': enregistrerMaj,
  'hist-select': el => { ui.histSel = el.dataset.date; ui.histEdition = false; rendre(); },
  'hist-modifier': () => { ui.histEdition = true; rendre(); },
  'hist-annuler': () => { ui.histEdition = false; rendre(); },
  'hist-sauver': async () => {
    if (!await confirmerSiNonSynchronise('Modifier ce snapshot')) return;
    const snap = state.snapshots.find(s => s.date === ui.histSel); if (!snap) return;
    const valeurs = {};
    for (const inp of $$('[data-edit]')) { const v = M.lireNombre(inp.value); if (v == null) return toast('Montant invalide.', 'erreur'); valeurs[inp.dataset.edit] = M.r2(v); }
    const plusRecent = !state.snapshots.some(s => s.date > snap.date);
    const majValeurs = plusRecent ? Object.fromEntries(state.comptes.filter(c => c.actif !== false && c.id in valeurs && M.r2(c.valeur) !== valeurs[c.id]).map(c => [c.id, valeurs[c.id]])) : {};
    ecrire(store.enregistrerSnapshot(Object.assign({}, snap, { valeurs, modifieLe: new Date().toISOString() }), majValeurs)).catch(() => {});
    ui.histEdition = false; toast('Snapshot modifié.'); rendre();
  },
  'hist-supprimer': async () => {
    if (!await confirmer('Supprimer ce snapshot ?', `Le point du ${esc(dateFr(ui.histSel))} sera retiré de l’historique.`, 'Supprimer', true)) return;
    ecrire(store.supprimerSnapshot(ui.histSel)).catch(() => {}); ui.histSel = null; toast('Snapshot supprimé.');
  },
  'compte-ajouter': () => ouvrirCompte(null),
  'compte-modifier': el => ouvrirCompte(el.dataset.id),
  'compte-reactiver': el => { const c = state.comptes.find(x => x.id === el.dataset.id); ecrire(store.enregistrerCompte(Object.assign({}, c, { actif: true }))).catch(() => {}); },
  'compte-retirer': async () => {
    const c = state.comptes.find(x => x.id === $('#dialogue').dataset.compte); if (!c) return;
    const dansHistorique = state.snapshots.some(s => c.id in (s.valeurs || {}));
    $('#dialogue').close();
    if (dansHistorique) {
      if (!await confirmer('Archiver ce compte ?', `« ${esc(c.nom)} » n’apparaîtra plus dans la mise à jour ni dans le patrimoine actuel, mais restera dans l’historique. Tu pourras le réactiver.`, 'Archiver')) return;
      ecrire(store.enregistrerCompte(Object.assign({}, c, { actif: false }))).catch(() => {});
    } else {
      if (!await confirmer('Supprimer ce compte ?', `« ${esc(c.nom)} » et ses crédits seront supprimés définitivement.`, 'Supprimer', true)) return;
      ecrire(store.supprimerCompte(c.id)).catch(() => {});
    }
  },
  'fermer': () => $('#dialogue').close(),
  'credit-ajouter': formulaireCredit,
  'credit-annuler': () => { $('#credit-ajout').innerHTML = '<button type="button" class="btn btn-petit" data-action="credit-ajouter">+ Ajouter un crédit</button>'; },
  'credit-valider': el => {
    const r = el._resultat, compteId = $('#dialogue').dataset.compte;
    const nom = $('#cr-nom').value.trim() || 'Crédit';
    if (!r || !compteId) return;
    ecrire(store.enregistrerCredit({ id: nouvelId(), compteId, nom, crdInitial: r.crdInitial, echeancier: r.echeancier })).catch(() => {});
    toast('Crédit ajouté.');
  },
  'credit-renommer': el => {
    const cr = state.credits.find(x => x.id === el.dataset.id); if (!cr) return;
    const ligne = el.closest('.credit-ligne');
    ligne.innerHTML = `<div class="infos"><input class="champ" style="width:100%;border:1px solid var(--border2);border-radius:8px;padding:6px 8px" id="cr-renom" value="${esc(cr.nom)}" maxlength="60"></div>
      <button type="button" class="btn btn-petit btn-primaire" data-action="credit-renommer-ok" data-id="${esc(cr.id)}">OK</button>`;
    $('#cr-renom').focus();
  },
  'credit-renommer-ok': el => {
    const cr = state.credits.find(x => x.id === el.dataset.id), nom = $('#cr-renom').value.trim();
    if (cr && nom) ecrire(store.enregistrerCredit(Object.assign({}, cr, { nom }))).catch(() => {});
  },
  'credit-supprimer': async el => {
    const cr = state.credits.find(x => x.id === el.dataset.id); if (!cr) return;
    const dlg = $('#dialogue'); dlg.close();
    const ok = await confirmer('Retirer ce crédit ?', `« ${esc(cr.nom)} » ne sera plus déduit du patrimoine actuel ni de la projection. Les snapshots déjà enregistrés ne changent pas.`, 'Retirer', true);
    if (ok) ecrire(store.supprimerCredit(cr.id)).catch(() => {});
    ouvrirCompte(cr.compteId);
  },
  'hyp-ajouter': () => ouvrirHypothese(null),
  'hyp-modifier': el => ouvrirHypothese(el.dataset.id),
  'hyp-active': el => majHypotheses(l => l.map(h => h.id === el.dataset.id ? Object.assign(h, { active: h.active === false }) : h)),
  'hyp-courbe': el => majHypotheses(l => l.map(h => h.id === el.dataset.id ? Object.assign(h, { visible: h.visible === false }) : h)),
  'hyp-supprimer': async el => {
    const h = M.hypotheses(state).find(x => x.id === el.dataset.id); if (!h) return;
    if (await confirmer('Supprimer cette hypothèse ?', `« ${esc(h.nom || 'Hypothèse')} » et sa courbe seront retirées.`, 'Supprimer', true)) majHypotheses(l => l.filter(x => x.id !== h.id));
  },
  'hyp-total': () => ecrire(store.enregistrerReglages({ totalHypotheses: (state.reglages || {}).totalHypotheses === false })).catch(() => {}),
  'zoom-reinit': el => reinitZoom(el.dataset.graph, el.id),
  'credit-tableau': el => ouvrirTableauCredit(el.dataset.id),
  'fermer-tableau': () => $('#dlg-tableau').close(),

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) { e.preventDefault(); actions[el.dataset.action](el, e); return; }
  const f = e.target.closest('#filtre button');
  if (f) { ui.filtre = f.dataset.filtre; setPref('filtre', ui.filtre); rendre(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.maj;
  if (id && ui.maj) { ui.maj.valeurs[id] = e.target.value; ui.maj.modifie = true; sauverBrouillon(); rafraichirMaj(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'maj-date' && ui.maj) { ui.maj.date = e.target.value || M.dateISO(); if (ui.maj.modifie) sauverBrouillon(); rendre(); }
  if (ui.page === 'projection' && e.target.dataset && 'obj' in e.target.dataset) surChangementProjection(e.target);
});

// Nouvelles données (chargement, autre appareil, écriture locale)
function surDonnees(d) {
  state = d;
  if ($('#app').hidden) { verifierPret(); return; }
  const dlgCompte = $('#dialogue');
  if (dlgCompte.open && dlgCompte.dataset.compte && $('#fc-credits')) {
    // Rafraîchit la liste des crédits du compte ouvert sans fermer le formulaire
    const c = state.comptes.find(x => x.id === dlgCompte.dataset.compte);
    if (c && $('#fc-type').value === 'immobilier' && !$('#credit-ajout .boite')) $('#fc-credits').innerHTML = blocCredits(c);
    else if (c && $('#credit-ajout .boite') && creditsDe(c.id).length !== $$('#fc-credits .credit-ligne').length) $('#fc-credits').innerHTML = blocCredits(c);
  }
  if (ui.page === 'maj' && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.maj) { rafraichirMaj(); return; }
  if (ui.page === 'projection') return rendreApresFocus();
  rendre();
}
// Après une saisie validée par Tab ou un clic ailleurs, on attend que le focus ait atteint
// le champ suivant avant de redessiner, pour le lui rendre ensuite.
let rendreProgramme = null;
function rendreApresFocus() {
  clearTimeout(rendreProgramme);
  rendreProgramme = setTimeout(rendre, 0);
}

// ══════════════════════════════════════════════════════════════════════
// DÉMARRAGE
// ══════════════════════════════════════════════════════════════════════
function afficherApp() { clearTimeout(minuteurChargement); $('#ecran-chargement').hidden = true; $('#ecran-connexion').hidden = true; $('#app').hidden = false; route(); }
function afficherConnexion(erreur) {
  clearTimeout(minuteurChargement);
  $('#ecran-chargement').hidden = true; $('#app').hidden = true; $('#ecran-connexion').hidden = false;
  const p = $('#connexion-erreur'); p.hidden = !erreur; p.textContent = erreur || '';
  $('#connexion-info').hidden = true;
}
const MESSAGES_AUTH = {
  'auth/invalid-credential': 'Adresse ou mot de passe incorrect.',
  'auth/wrong-password': 'Adresse ou mot de passe incorrect.',
  'auth/user-not-found': 'Adresse ou mot de passe incorrect.',
  'auth/invalid-email': 'Adresse e-mail invalide.',
  'auth/too-many-requests': 'Trop de tentatives : réessaie dans quelques minutes.',
  'auth/network-request-failed': 'Pas de connexion internet.',
  'auth/user-disabled': 'Ce compte est désactivé.',
};
const messageAuth = e => MESSAGES_AUTH[e.code] || ('Connexion impossible : ' + (e.code || e.message));

// ── Écran de chargement ──
// Tant que Firebase n'a pas confirmé les données, l'application reste masquée derrière une roue.
// Si la connexion est lente ou absente, on propose d'ouvrir les données gardées sur l'appareil.
let minuteurChargement = null, horsLigneAccepte = false;
function afficherChargement(texte) {
  $('#app').hidden = true; $('#ecran-connexion').hidden = true; $('#ecran-chargement').hidden = false;
  $('#chargement-texte').textContent = texte;
  $('#chargement-detail').hidden = true; $('#chargement-continuer').hidden = true;
  clearTimeout(minuteurChargement);
  const proposer = msg => { $('#chargement-detail').textContent = msg; $('#chargement-detail').hidden = false; $('#chargement-continuer').hidden = false; };
  if (!navigator.onLine) proposer('Pas de connexion internet. Tu peux ouvrir les données gardées sur cet appareil ; tes modifications partiront au retour du réseau.');
  else minuteurChargement = setTimeout(() => proposer('La connexion à Firebase est lente. Tu peux patienter ou ouvrir les données gardées sur cet appareil (peut-être pas à jour).'), 8000);
}
// L'application s'affiche quand les données sont confirmées par Firebase (ou si l'utilisateur a choisi de continuer).
function verifierPret() {
  if (!store || !state || !$('#app').hidden) return false;
  if (store.mode === 'local' || store.estSynchronise() || horsLigneAccepte) { afficherApp(); return true; }
  return false;
}
async function demarrer() {
  $('#chargement-continuer').onclick = () => { horsLigneAccepte = true; if (!verifierPret()) $('#chargement-texte').textContent = 'Lecture des données de l’appareil…'; };
  const forcerLocal = new URLSearchParams(location.search).get('mode') === 'local';
  if (!FIREBASE_CONFIG.apiKey || forcerLocal) {
    store = creerStoreLocal(surDonnees);
    store.demarrer();
    afficherApp();
    return;
  }
  afficherChargement('Chargement…');
  let fb;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    fb = { app, auth, fs };
  } catch (e) {
    return afficherConnexion('Impossible de charger Firebase. Vérifie ta connexion puis recharge la page.');
  }
  const app = fb.app.initializeApp(FIREBASE_CONFIG);
  const auth = fb.auth.getAuth(app);
  let db;
  try { db = fb.fs.initializeFirestore(app, { localCache: fb.fs.persistentLocalCache({ tabManager: fb.fs.persistentMultipleTabManager() }) }); }
  catch { db = fb.fs.getFirestore(app); }
  $('#form-connexion').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#cx-valider'); btn.disabled = true; btn.textContent = 'Connexion…';
    try { await fb.auth.signInWithEmailAndPassword(auth, $('#cx-email').value.trim(), $('#cx-mdp').value); }
    catch (e) { afficherConnexion(messageAuth(e)); }
    finally { btn.disabled = false; btn.textContent = 'Se connecter'; }
  };
  $('#cx-oubli').onclick = async () => {
    const email = $('#cx-email').value.trim();
    if (!email) return afficherConnexion('Saisis d’abord ton adresse e-mail.');
    try {
      await fb.auth.sendPasswordResetEmail(auth, email);
      afficherConnexion();
      const i = $('#connexion-info'); i.hidden = false; i.textContent = 'Si cette adresse correspond à ton compte, un e-mail de réinitialisation vient de partir (pense aux indésirables).';
    } catch (e) { afficherConnexion(messageAuth(e)); }
  };
  fb.auth.onAuthStateChanged(auth, async user => {
    if (store) { store.arreter(); store = null; state = null; }
    $('#app').hidden = true;
    if (!user) return afficherConnexion();
    if (EMAIL_AUTORISE && (user.email || '').toLowerCase() !== EMAIL_AUTORISE.toLowerCase()) {
      await fb.auth.signOut(auth);
      return afficherConnexion(`Le compte ${user.email} n’est pas autorisé.`);
    }
    horsLigneAccepte = false;
    afficherChargement('Connexion à tes données…');
    store = await creerStoreFirebase(db, fb.fs, user.uid, surDonnees);
    store.email = user.email;
    store.deconnecter = () => fb.auth.signOut(auth);
    statut({ etat: 'synchro' });
    verifierPret();
  });
}
demarrer();

// ── Application installable (Chrome, Edge…) ──
let invitationInstallation = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); invitationInstallation = e; if (ui.page === 'reglages' && state) rendre(); });
addEventListener('appinstalled', () => { invitationInstallation = null; toast('Apogée est installée.'); if (ui.page === 'reglages' && state) rendre(); });
const estInstallee = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker', e)));
}
</script>
</body>
</html>
